; PlatformIO project for the ESP32 "Cheap Yellow Display" (ESP32-2432S028R)
; 2.8" ILI9341 240x320 TFT + XPT2046 resistive touch

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv  ; 3MB app partition (no OTA)

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    ; ---- LVGL config (include/lv_conf.h) ----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; ---- TFT_eSPI setup for the CYD ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
